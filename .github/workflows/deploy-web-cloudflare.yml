# The web app (chat, app, billing, share, onboard and super admin on classgrid.in: the client/ folder) published to
# Cloudflare Pages, so the web app does not stop when Vercel does (owner, 2026-11-21: Vercel paused the whole team for
# 30 days, "Fluid Active CPU" past the Hobby plan's fair use, and the web app, the payment page and the super admin
# dashboard went down with the website).
#
# The web app is static files: the server is api.classgrid.in on AWS. On Vercel a small piece of server code ran for
# every page (client/middleware.js): it puts an organization's name and icon on its own subdomain, a feature of the
# ERP, which is shut down. It is not needed here: the hosts served from Cloudflare all show Classgrid's own name.
#
# Needs one secret, CLOUDFLARE_PAGES_TOKEN (a Cloudflare API token with "Cloudflare Pages: Edit" on the account).
# Until it is set, a run builds nothing and says so. Everything else comes from the server settings already kept in
# PRODUCTION_ENV: the Cloudflare account, and the chat's public Supabase address and key.
name: Web app to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'infra/cloudflare-web/**'
      - '.github/workflows/deploy-web-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: web-cloudflare
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAGES_PROJECT: classgrid-web
    steps:
      - name: Is Cloudflare set up?
        id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::The CLOUDFLARE_PAGES_TOKEN secret is not set: nothing was built or published."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.ready.outputs.on == 'true'
        uses: actions/checkout@v4

      - name: Node
        if: steps.ready.outputs.on == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The Cloudflare account, and the chat's Supabase address and key, are in the server settings. The key goes into
      # the pages people's browsers load, so only the public one (role "anon") is ever taken: anything else stops the run.
      - name: Settings from the server's
        if: steps.ready.outputs.on == 'true'
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          get() { printf '%s\n' "$PRODUCTION_ENV" | grep -m1 "^$1=" | cut -d= -f2- | tr -d '\r' | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"; }
          ACCOUNT="$(get R2_ACCOUNT_ID)"
          SUPABASE_URL="$(get SUPABASE_CHAT_URL)"
          SUPABASE_KEY="$(get SUPABASE_CHAT_KEY)"
          if [ -z "$ACCOUNT" ]; then echo "::error::R2_ACCOUNT_ID (the Cloudflare account) is not in PRODUCTION_ENV."; exit 1; fi
          if [ -n "$SUPABASE_KEY" ]; then
            echo "::add-mask::$SUPABASE_KEY"
            ROLE="$(KEY="$SUPABASE_KEY" node -e 'try { console.log(JSON.parse(Buffer.from(process.env.KEY.split(".")[1], "base64url").toString()).role || "") } catch { console.log("") }')"
            if [ "$ROLE" != "anon" ]; then echo "::error::SUPABASE_CHAT_KEY is not the public (anon) key: it must never be built into the pages."; exit 1; fi
          fi
          {
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
            echo "VITE_SUPABASE_CHAT_URL=$SUPABASE_URL"
            echo "VITE_SUPABASE_CHAT_KEY=$SUPABASE_KEY"
          } >> "$GITHUB_ENV"

      - name: Install
        if: steps.ready.outputs.on == 'true'
        working-directory: client
        run: npm ci --no-audit --no-fund

      # The same addresses the desktop build gives the client (desktop/scripts/build-client.mjs)
      - name: Build
        if: steps.ready.outputs.on == 'true'
        working-directory: client
        env:
          VITE_API_BASE_URL: https://api.classgrid.in
          VITE_API_URL: https://api.classgrid.in
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: npm run build

      # Pages serves index.html for every address that is not a file (there is no 404.html), which is what the
      # "/(.*) -> /index.html" rewrite does on Vercel. The header rules are a file in the build.
      - name: Cloudflare's rules for the pages
        if: steps.ready.outputs.on == 'true'
        run: |
          test -f client/dist/index.html
          test ! -e client/dist/404.html
          cp infra/cloudflare-web/_headers client/dist/_headers

      - name: Publish
        if: steps.ready.outputs.on == 'true'
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          # (the first run makes the Pages project; later runs find it there)
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

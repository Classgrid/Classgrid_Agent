name: test 2

# A test run (owner, 2026-11-19: "send one test github action, keep it running for 4 minutes, name it test 2"):
# it only waits 4 minutes, touches nothing, and exists to see a run in the Actions tab.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-2.yml'

jobs:
  wait:
    runs-on: ubuntu-latest
    steps:
      - name: Run for 4 minutes
        run: |
          echo "test 2 started at $(date -u)"
          sleep 240
          echo "test 2 finished at $(date -u)"

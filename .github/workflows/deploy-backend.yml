name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'



      - name: SSH and Deploy Backend
        uses: appleboy/ssh-action@master
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PRODUCTION_ENV
          script: |
            set -e
            cd /var/www/classgrid_platform
            
            # Pull the latest code from GitHub
            git fetch origin
            git reset --hard origin/main
            
            # FREE UP RAM & ADD SWAP SPACE TO PREVENT OUT-OF-MEMORY CRASHES DURING NPM INSTALL
            sudo fallocate -l 2G /swapfile || true
            sudo chmod 600 /swapfile || true
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || true
            sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true

            cd server
            echo "$PRODUCTION_ENV" > .env
            
            # Fix permissions in case root owns any files
            sudo chown -R ubuntu:ubuntu . || true
            
            # Free up disk space to prevent ENOSPC (Out of Space) errors during npm install
            sudo apt-get clean || true
            npm cache clean --force || true
            sudo rm -rf /tmp/* || true
            sudo journalctl --vacuum-time=1d || true

            # Run npm install. If it fails due to corruption (like ENOTEMPTY), wipe node_modules using sudo and retry.
            npm install --omit=dev --no-audit --no-fund --legacy-peer-deps || (sudo rm -rf node_modules && npm install --omit=dev --no-audit --no-fund --legacy-peer-deps)

            if ! command -v redis-server &> /dev/null; then
              sudo apt-get update || true
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y redis-server || true
            fi
            
            # ENSURE REDIS IS RUNNING WITHOUT RESTARTING IT
            sudo systemctl daemon-reload || true
            sudo systemctl enable redis-server || true
            sudo systemctl start redis-server || sudo service redis start || true
            
            # Since PM2 was stopped, use restart instead of reload
            pm2 restart classgrid --update-env
            MAIN_UP=0
            for i in $(seq 1 45); do
              if curl -sf -o /dev/null --max-time 3 http://localhost:3000/; then MAIN_UP=1; break; fi
              sleep 2
            done
            if [ "$MAIN_UP" = "1" ]; then
              for name in $(pm2 jlist | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).map(p=>p.name).filter(n=>n!=='classgrid').join(' ')))"); do
                pm2 restart "$name" --update-env
              done
            else
              echo "Main server did not come up, keeping the rescue server on the previous code"
            fi

name: Build Classgrid Code (our editor with the Classgrid AI inside)

# Option B: our own editor built from VS Code's open-source code (VS Code 1.143.1, VSCodium's latest supported tag), with the Classgrid AI
# built inside it, like Cursor's AI is inside Cursor:
# - the Agent chat on the right side, and all of Classgrid (Agent, Studio, Projects) in a tab: our same screens
#   (client/, the desktop build);
# - the Classgrid desktop app's own parts (desktop/runner.js...), so the AI's terminal, files and memory work on
#   this computer;
# - the Open VSX extension store, and no editor server (no localhost in the editor).
# The "Proof: it is B" step stops the build if the Classgrid AI isn't inside the finished editor.
# Runs when classgrid-editor/ changes (or by hand); the finished editor is attached to a GitHub release of this repo.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'classgrid-editor/**'
      - '.github/workflows/build-classgrid-editor.yml'

permissions:
  contents: write

env:
  APP_NAME: Classgrid
  BINARY_NAME: classgrid-code
  GLOBAL_DIRNAME: classgrid-code
  GH_REPO_PATH: ${{ github.repository }}
  ASSETS_REPOSITORY: ${{ github.repository }}
  ORG_NAME: Classgrid
  OS_NAME: windows
  VSCODE_QUALITY: stable
  VSCODE_ARCH: x64
  # Pinned to VSCodium's latest supported VS Code tag (their patches don't fit 1.144.0 yet: media-preview moved).
  # Bump both when vscodium/vscodium patches 1.144: VSCODE_VERSION and VSCODIUM_COMMIT (a commit whose
  # upstream/stable.json has that tag).
  VSCODE_VERSION: '1.143.1'
  VSCODIUM_COMMIT: ca7f7b44b5e5c3faa663f6cdc043998f71936653
  DISABLE_UPDATE: 'yes'
  SHOULD_BUILD: 'yes'
  SHOULD_BUILD_REH: 'no'
  SHOULD_BUILD_REH_WEB: 'no'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      # Only the folders this needs (actions/checkout stops on this repo's old .github_org entry)
      - name: Get classgrid-editor, our screens (client) and the desktop app's parts
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse --no-recurse-submodules "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" repo
          git -C repo sparse-checkout set classgrid-editor client desktop

      - name: Get the VSCodium build scripts (pinned, for VS Code ${{ env.VSCODE_VERSION }})
        run: |
          git clone https://github.com/VSCodium/vscodium.git repo/classgrid-editor/vscodium
          git -C repo/classgrid-editor/vscodium checkout "$VSCODIUM_COMMIT"
          TAG=$(node -p "require('./repo/classgrid-editor/vscodium/upstream/stable.json').tag")
          [ "$TAG" = "$VSCODE_VERSION" ] || { echo "VSCODIUM_COMMIT builds VS Code $TAG, not $VSCODE_VERSION: bump them together" >&2; exit 1; }

      - name: Classgrid name and logo
        run: bash repo/classgrid-editor/brand.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: repo/classgrid-editor/vscodium/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The Classgrid AI part: our screens (the desktop build, made for the editor: loaded from its own files), the
      # extension that holds them, and the desktop app's runner, memory and chats
      - name: Build our screens (client, the editor build)
        working-directory: repo/client
        run: |
          npm ci --no-audit --no-fund
          node ../desktop/scripts/build-client.mjs --editor
          test -f ../desktop/app-editor/index.html

      - name: Pack the Classgrid AI part
        working-directory: repo
        run: |
          EXT=classgrid-editor/out/classgrid
          rm -rf "$EXT" && mkdir -p "$EXT/desktop"
          cp -r classgrid-editor/extension/. "$EXT/"
          cp -r desktop/app-editor "$EXT/app"
          cp desktop/runner.js desktop/aimemory.js desktop/computer.js desktop/chats.js desktop/memory.js "$EXT/desktop/"
          SIO=$(node -p "require('./desktop/package.json').dependencies['socket.io-client']")
          (cd "$EXT/desktop" && echo '{"name":"classgrid-desktop-parts","private":true}' > package.json && npm install --no-audit --no-fund --omit=dev "socket.io-client@${SIO}")
          ls "$EXT" "$EXT/desktop"

      - name: Get VS Code's open-source code (${{ env.VSCODE_VERSION }})
        working-directory: repo/classgrid-editor/vscodium
        run: ./get_repo.sh

      - name: Build the editor
        working-directory: repo/classgrid-editor/vscodium
        run: ./build.sh

      - name: Pack the Windows app
        working-directory: repo/classgrid-editor/vscodium
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt
          ./build/windows/package.sh

      - name: Put the Classgrid AI inside the editor (built-in extension)
        working-directory: repo/classgrid-editor
        run: |
          APPDIR=vscodium/VSCode-win32-x64/resources/app
          test -d "$APPDIR/extensions"
          rm -rf "$APPDIR/extensions/classgrid"
          cp -r out/classgrid "$APPDIR/extensions/classgrid"
          # Our Studio colors (the same theme as the Classgrid app's editor, desktop/editor-themes), the editor's default
          cp ../desktop/editor-themes/default-dark-modern.json "$APPDIR/extensions/theme-defaults/themes/dark_modern.json"
          cp ../desktop/editor-themes/default-light-modern.json "$APPDIR/extensions/theme-defaults/themes/light_modern.json"
          # Our editor styles (workbench.css: no Accounts/settings icons, the Agent button top right, the panel's one
          # thin top row), added to the editor's own styles; the editor checks its files, so its check value is updated
          node -e "
            const fs = require('fs'), crypto = require('crypto');
            const app = process.argv[1], rel = 'vs/workbench/workbench.desktop.main.css', css = app + '/out/' + rel;
            fs.appendFileSync(css, '\n' + fs.readFileSync('workbench.css', 'utf8'));
            const p = JSON.parse(fs.readFileSync(app + '/product.json', 'utf8'));
            if (!p.checksums || !p.checksums[rel]) throw new Error('no check value for ' + rel);
            p.checksums[rel] = crypto.createHash('sha256').update(fs.readFileSync(css)).digest('base64').replace(/=+$/, '');
            // The Help menu: no links to Microsoft's or VSCodium's sites (VS Code shows a Help link only when its address
            // is set); Documentation opens Classgrid's docs
            for (const k of ['introductoryVideosUrl', 'keyboardShortcutsUrlLinux', 'keyboardShortcutsUrlMac', 'keyboardShortcutsUrlWin', 'releaseNotesUrl', 'requestFeatureUrl', 'tipsAndTricksUrl', 'twitterUrl', 'youTubeUrl', 'reportIssueUrl', 'licenseUrl', 'privacyStatementUrl', 'serverLicenseUrl']) delete p[k];
            p.documentationUrl = 'https://classgrid.in/docs';
            fs.writeFileSync(app + '/product.json', JSON.stringify(p, null, '\t'));
          " "$APPDIR"

      - name: 'Proof: it is B (the Classgrid AI is inside the editor)'
        working-directory: repo/classgrid-editor
        run: |
          APP=vscodium/VSCode-win32-x64
          EXT=$APP/resources/app/extensions/classgrid
          fail() { echo "NOT B: $1" >&2; exit 1; }
          ls "$APP"/*.exe
          { test -f "$APP/Classgrid Code.exe" || test -f "$APP/classgrid-code.exe"; } || fail "the editor program (Classgrid Code.exe) is missing"
          node -e "const p=require('./$APP/resources/app/product.json');if(p.nameLong!=='Classgrid Code')process.exit(1)" || fail "the editor isn't named Classgrid Code"
          node -e "const p=require('./$APP/resources/app/product.json');if(!/open-vsx\.org/.test(p.extensionsGallery&&p.extensionsGallery.serviceUrl||''))process.exit(1)" || fail "the extension store isn't Open VSX"
          test -f "$EXT/extension.js" || fail "the Classgrid extension isn't inside the editor"
          node -e "const p=require('./$EXT/package.json');const c=p.contributes.viewsContainers.secondarySidebar.find(x=>x.id==='classgrid');const v=p.contributes.views.classgrid.find(x=>x.id==='classgrid.agent');if(!c||!v)process.exit(1)" || fail "the Agent panel on the right side isn't there"
          test -f "$EXT/app/index.html" || fail "our Classgrid screens aren't inside the editor"
          ls "$EXT/app/assets/"*.js > /dev/null || fail "our screens' code isn't inside the editor"
          for f in runner.js aimemory.js chats.js memory.js; do test -f "$EXT/desktop/$f" || fail "the desktop part $f isn't inside"; done
          test -d "$EXT/desktop/node_modules/socket.io-client" || fail "the runner's connection to Classgrid isn't inside"
          grep -q 'window.classgridDesktop' "$EXT/bridge.js" || fail "the bridge for our screens isn't inside"
          ! grep -qE 'createServer|localhost:[0-9]' "$EXT/extension.js" || fail "the Agent panel uses a localhost server"
          grep -q 'src="\./assets/' "$EXT/app/index.html" || fail "our screens aren't the editor build (loaded from the editor's own files)"
          grep -q '"/editor/project"' "$EXT/extension.js" || fail "the right side isn't only the Agent panel"
          grep -q 'registerUriHandler' "$EXT/extension.js" || fail "the login from the Classgrid app isn't there"
          cmp -s ../desktop/editor-themes/default-dark-modern.json "$APP/resources/app/extensions/theme-defaults/themes/dark_modern.json" || fail "our Studio colors aren't the editor's theme"
          grep -q 'content: "Agent"' "$APP/resources/app/out/vs/workbench/workbench.desktop.main.css" || fail "the Agent button (our editor styles) isn't in the editor"
          grep -q 'body.classgrid-overlay' "$APP/resources/app/out/vs/workbench/workbench.desktop.main.css" || fail "the full-window layer for big windows (Plugins) isn't in the editor styles"
          grep -q '_classgrid.setAgentOverlay' "$APP/resources/app/out/vs/workbench/workbench.desktop.main.js" || fail "our VS Code change for big windows (classgrid-agent-overlay.patch) isn't in the editor"
          grep -q '_classgrid.setStripWidth' "$APP/resources/app/out/vs/workbench/workbench.desktop.main.js" || fail "our VS Code change for the chats sidebar on the left edge (classgrid-left-strip.patch) isn't in the editor"
          node -e "const p=require('./$APP/resources/app/product.json');const bad=['introductoryVideosUrl','releaseNotesUrl','tipsAndTricksUrl','reportIssueUrl','requestFeatureUrl'].filter(k=>p[k]);if(bad.length||p.documentationUrl!=='https://classgrid.in/docs'){console.error(bad);process.exit(1)}" || fail "the Help menu still has Microsoft or VSCodium links"
          node -e "const fs=require('fs'),c=require('crypto');const a='./$APP/resources/app',r='vs/workbench/workbench.desktop.main.css';const p=require(a+'/product.json');if(p.checksums[r]!==c.createHash('sha256').update(fs.readFileSync(a+'/out/'+r)).digest('base64').replace(/=+$/,''))process.exit(1)" || fail "the editor's file check doesn't match our styles (it would say it is corrupt)"
          grep -rqE 'ACCOUNTS_VISIBILITY_PREFERENCE_KEY,[^,]+,\s*!1\)|ACCOUNTS_VISIBILITY_PREFERENCE_KEY, StorageScope.PROFILE, false\)' "$APP/resources/app/out/vs/workbench/" || echo "note: couldn't find the Accounts default in the packed code to check it (it is minified)"
          echo "PROOF OK: Classgrid Code $(node -p "require('./$APP/resources/app/product.json').version") with the Classgrid AI inside (Agent on the right, our screens, the AI's runner)."

      - name: Put the editor in a release
        working-directory: repo/classgrid-editor/vscodium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          7z a -tzip "../Classgrid-Code-win32-x64-${RELEASE_VERSION}.zip" "./VSCode-win32-x64/*"
          gh release create "editor-${RELEASE_VERSION}" "../Classgrid-Code-win32-x64-${RELEASE_VERSION}.zip" \
            --repo "${{ github.repository }}" --title "Classgrid Code ${RELEASE_VERSION}" \
            --notes "Classgrid Code: our editor (VS Code ${MS_TAG}, built with VSCodium's scripts) with the Classgrid AI inside: the Agent on the right, our Classgrid screens, the AI's terminal, files and memory on the computer."

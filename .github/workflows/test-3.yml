name: test 3

# test 3 (owner, 2026-11-19): runs 10 minutes from the push, then reports. One job, one sleep.
# Started 19-11 19:53 IST, ends 19-11 20:03 IST.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-3.yml'

jobs:
  test-3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run for 10 minutes
        run: |
          echo "test 3 started: $(date -u)"
          sleep 600
          echo "test 3 finished: $(date -u)"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classgrid</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0a; color: #ededed; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { text-align: center; max-width: 360px; padding: 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { color: #a1a1a1; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  body { -webkit-app-region: drag; } /* no Windows title bar: the window moves by its page */
  button { -webkit-app-region: no-drag; }
  button { background: #ededed; color: #0a0a0a; border: 0; border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>Can't reach Classgrid</h1>
    <p>Check your internet connection, then try again.</p>
    <button onclick="window.classgridDesktop && window.classgridDesktop.retry()">Try again</button>
  </div>
</body>
</html>

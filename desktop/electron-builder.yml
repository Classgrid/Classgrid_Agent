# Windows installer for the Classgrid desktop app: "Classgrid Setup x.y.z.exe" in dist/
appId: in.classgrid.app
productName: Classgrid
copyright: Copyright © Classgrid
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - runner.js
  - editor.js
  - browser.js
  - chats.js
  - memory.js
  - aimemory.js
  - recorder.js
  - computer.js
  - offline.html
  - splash/splash.html
  - app/**/*
  - build/icon.png
  - package.json
# Classgrid Code, the built-in editor (scripts/get-editor.mjs puts it in editor/): shipped as resources/editor, outside
# app.asar, because its own node.exe runs it
extraResources:
  # The newest Classgrid add-on for the built-in editor (copied into it when it starts)
  - from: ../infra/ide/bridge/extension.js
    to: bridge/extension.js
  - from: editor
    to: editor
  # electron-builder always skips folders named node_modules, so the editor's are listed one by one
  - from: editor/node_modules
    to: editor/node_modules
  - from: editor/extensions/node_modules
    to: editor/extensions/node_modules
  - from: editor/extensions/esbenp.prettier-vscode/node_modules
    to: editor/extensions/esbenp.prettier-vscode/node_modules
  - from: editor/extensions/formulahendry.code-runner/node_modules
    to: editor/extensions/formulahendry.code-runner/node_modules
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Classgrid
  artifactName: "Classgrid Setup ${version}.${ext}"
protocols:
  - name: Classgrid
    schemes: [classgrid]
publish:
  provider: generic
  url: https://pub-96a564393c0440f2bab37ad8bbe92398.r2.dev/desktop

# Windows installer for the Classgrid desktop app: "Classgrid Setup x.y.z.exe" in dist/
appId: in.classgrid.app
productName: Classgrid
copyright: Copyright © Classgrid
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - runner.js
  - offline.html
  - app/**/*
  - build/icon.png
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Classgrid
  artifactName: "Classgrid Setup ${version}.${ext}"
protocols:
  - name: Classgrid
    schemes: [classgrid]
publish:
  provider: generic
  url: https://pub-96a564393c0440f2bab37ad8bbe92398.r2.dev/desktop

# Windows installer for the Classgrid desktop app: "Classgrid Setup x.y.z.exe" in dist/
appId: in.classgrid.app
productName: Classgrid
copyright: Copyright © Classgrid
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - runner.js
  - codeeditor.js
  - browser.js
  - chats.js
  - memory.js
  - uploads.js
  - doctext.js
  - pdfpages.js
  - aimemory.js
  - recorder.js
  - computer.js
  - terminal.js
  - offline.html
  - splash/splash.html
  - app/**/*
  - build/icon.png
  - package.json
# Classgrid Code, our editor with the Classgrid AI inside (scripts/get-classgrid-code.mjs gets the newest build):
# shipped packed as resources/classgrid-code.zip, unpacked once by codeeditor.js
extraResources:
  # The user's terminals run on Classgrid Code's program as Node, so this file sits outside app.asar
  - from: ptyhost.js
    to: ptyhost.js
  - from: classgrid-code.zip
    to: classgrid-code.zip
  # (the icon of the "Classgrid Code" shortcut, build/installer.nsh)
  - from: build/code.ico
    to: classgrid-code.ico
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Classgrid
  # Classgrid Code's own desktop and Start menu icon
  include: build/installer.nsh
  artifactName: "Classgrid Setup ${version}.${ext}"
protocols:
  - name: Classgrid
    schemes: [classgrid]
publish:
  provider: generic
  url: https://pub-96a564393c0440f2bab37ad8bbe92398.r2.dev/desktop
